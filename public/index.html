<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<title>Центр управления</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>

<!-- вход -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="logo big">W<i></i></div>
    <h1>Центр управления</h1>
    <p class="mut" id="loginMsg">Вход только для владельца</p>
    <label>Пароль<input type="password" id="lp" autocomplete="current-password" required></label>
    <label>Код из приложения 2FA<input id="lc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required></label>
    <button class="btn pri wide" id="lbtn">Войти</button>
  </form>
</section>

<!-- центр -->
<div id="app" hidden>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo">W<i></i></div>
        <div><b>Центр управления</b><span class="mut sm" id="today"></span></div>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Сервис, заметка или команда" aria-label="Поиск" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="topbtns">
        <button class="ib" id="openSettings" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
        <button class="ib" id="logout" aria-label="Выйти"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
      </div>
    </header>

    <div class="cards" data-tab="home">
      <section class="card" id="cMandala"></section>
      <section class="card" id="cMoney"></section>
      <section class="card" id="cHosts"></section>
    </div>

    <section class="card" data-tab="services">
      <div class="head"><h2>Сервисы</h2><div class="row"><button class="btn" id="editSvc">Править</button><button class="btn" id="addSvc">+ Добавить</button></div></div>
      <div id="services" class="groups"></div>
    </section>

    <div class="split">
      <section class="card" data-tab="notes">
        <div class="head"><h2>Заметки</h2><button class="btn pri" id="addNote">+ Заметка</button></div>
        <div id="notes" class="notes"></div>
      </section>
      <section class="card" data-tab="commands">
        <div class="head"><h2>Команды</h2><button class="btn" id="addCmd">+ Команда</button></div>
        <div id="commands"></div>
      </section>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-t="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Главная</button>
    <button data-t="services"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Сервисы</button>
    <button data-t="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Заметки</button>
    <button data-t="commands"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8l4 4-4 4"/><path d="M12 17h7"/></svg>Команды</button>
  </nav>
</div>

<!-- модальное окно -->
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h3 id="mTitle"></h3><div id="mBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
